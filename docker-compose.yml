services:
  fileforage:
    image: ghcr.io/sor85/fileforage:latest
    # NVIDIA GPU：改用 ghcr.io/sor85/fileforage:latest-cuda，并取消下方 deploy 段的注释
    container_name: fileforage
    restart: unless-stopped
    ports:
      - "8730:8730"
    environment:
      FF_ROOTS: /media
      # 国内网络可使用镜像站下载模型
      # HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ./data:/data          # 索引数据库与缩略图
      - ./models:/models      # 模型缓存（首次启动自动下载约 1.5 GB）
      - /path/to/your/files:/media/files:ro   # 需要检索的目录，可挂载多个，只读即可
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
